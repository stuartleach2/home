<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1460" viewBox="0 0 900 1460" role="img" aria-labelledby="title desc">
  <title id="title">Human-led, AI-assisted website delivery workflow</title>
  <desc id="desc">A human works with ChatGPT to define and refine a desired change. Codex exchanges information and code with the GitHub Repository. The proposed change then flows through a pull request, human review, merge, GitHub Pages and finally the live website.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0v8l11-4z" fill="#6f42c1"/></marker>
    <marker id="arrowBack" markerWidth="12" markerHeight="12" refX="1" refY="4" orient="auto"><path d="M11 0v8L0 4z" fill="#6f42c1"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".13"/></filter>
  </defs>
  <rect width="900" height="1460" rx="24" fill="#f7f4fc"/>
  <g fill="none" stroke="#6f42c1" stroke-width="5" marker-end="url(#arrow)">
    <path d="M450 145v45"/><path d="M450 305v45"/><path d="M450 465v45"/>
    <path d="M450 730v45"/><path d="M450 890v45"/><path d="M450 1050v45"/><path d="M450 1210v45"/><path d="M450 1370v35"/>
  </g>
  <path d="M390 635H510" fill="none" stroke="#6f42c1" stroke-width="6" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="180" y="35" width="540" height="110" rx="18" fill="#fff"/>
    <rect x="180" y="190" width="540" height="115" rx="18" fill="#fff"/>
    <rect x="125" y="350" width="650" height="115" rx="18" fill="#fff"/>
    <rect x="60" y="535" width="330" height="195" rx="18" fill="#fff" stroke="#6f42c1" stroke-width="3"/>
    <rect x="510" y="535" width="330" height="195" rx="18" fill="#6f42c1"/>
    <rect x="180" y="775" width="540" height="115" rx="18" fill="#fff"/>
    <rect x="180" y="935" width="540" height="115" rx="18" fill="#fff" stroke="#6f42c1" stroke-width="3"/>
    <rect x="180" y="1095" width="540" height="115" rx="18" fill="#fff"/>
    <rect x="180" y="1255" width="540" height="115" rx="18" fill="#fff"/>
    <rect x="180" y="1405" width="540" height="50" rx="18" fill="#241833"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#251b32">
    <g font-size="30" font-weight="700">
      <text x="450" y="102">Human</text><text x="450" y="260">ChatGPT</text>
      <text x="450" y="400">Define / refine the</text><text x="450" y="438">desired change</text>
      <text x="225" y="600">Codex</text><text x="675" y="600" fill="#fff">GitHub Repository</text>
      <text x="450" y="845">Pull Request</text><text x="450" y="1005">Human Review</text>
      <text x="450" y="1165">Merge</text><text x="450" y="1325">GitHub Pages</text>
      <text x="450" y="1440" font-size="26" fill="#fff">Live Website</text>
    </g>
    <g font-size="20" fill="#6c6275">
      <text x="450" y="127">defines intent and approves</text><text x="450" y="287">learn · plan · explain · design</text>
      <text x="225" y="640">inspect · edit · test</text><text x="225" y="670">commit · prepare changes</text>
      <text x="675" y="640" fill="#eee7fa">source control</text><text x="675" y="670" fill="#eee7fa">source of truth</text>
      <text x="450" y="870">visible, reviewable proposal</text><text x="450" y="1030">approve · revise · reject</text>
      <text x="450" y="1190">approved code enters source of truth</text><text x="450" y="1350">publishes the merged static site</text>
    </g>
    <text x="450" y="520" font-size="19" font-weight="700" fill="#6f42c1">bidirectional repository work</text>
  </g>
</svg>
