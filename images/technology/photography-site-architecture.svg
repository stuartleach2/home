  <rect width="1200" height="620" rx="24" fill="#f7f4fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#6f42c1" stroke-width="5" marker-end="url(#arrow)">
      <path d="M205 180 H270"/><path d="M450 180 H515"/><path d="M725 180 H790"/><path d="M980 215 V280"/><path d="M980 400 V465"/><path d="M660 390 V300"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="35" y="120" width="170" height="120" rx="18" fill="#fff"/><rect x="270" y="120" width="180" height="120" rx="18" fill="#fff"/>
      <rect x="515" y="120" width="210" height="120" rx="18" fill="#fff"/><rect x="790" y="120" width="380" height="120" rx="18" fill="#6f42c1"/>
      <rect x="790" y="280" width="380" height="120" rx="18" fill="#fff"/><rect x="790" y="465" width="380" height="120" rx="18" fill="#241833"/>
      <rect x="515" y="390" width="290" height="120" rx="18" fill="#fff" stroke="#6f42c1" stroke-width="3"/>
