<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1440" viewBox="0 0 800 1440" role="img" aria-labelledby="title desc">
  <title id="title">Codex pull request workflow</title>
  <desc id="desc">An idea moves through planning, a Codex change, validation, a pull request, human review, merge, GitHub Pages, and feedback.</desc>
  <defs>
