      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f42c1"/>
    </marker>
  </defs>
  <rect width="800" height="1440" rx="24" fill="#f7f4fc"/>
  <g fill="#ffffff" stroke="#6f42c1" stroke-width="4">
    <rect x="140" y="30" width="520" height="100" rx="18"/>
    <rect x="140" y="190" width="520" height="100" rx="18"/>
    <rect x="140" y="350" width="520" height="100" rx="18"/>
    <rect x="140" y="510" width="520" height="100" rx="18"/>
    <rect x="140" y="670" width="520" height="100" rx="18"/>
    <rect x="140" y="830" width="520" height="100" rx="18"/>
    <rect x="140" y="990" width="520" height="100" rx="18"/>
    <rect x="140" y="1150" width="520" height="100" rx="18"/>
    <rect x="140" y="1310" width="520" height="100" rx="18"/>
  </g>
  <g stroke="#6f42c1" stroke-width="5" marker-end="url(#arrow)">
    <path d="M400 138v36"/><path d="M400 298v36"/><path d="M400 458v36"/><path d="M400 618v36"/>
    <path d="M400 778v36"/><path d="M400 938v36"/><path d="M400 1098v36"/><path d="M400 1258v36"/>
  </g>
  <g fill="#241833" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="400" y="90">Idea</text>
    <text x="400" y="250">Plan</text>
    <text x="400" y="410">Codex Change</text>
    <text x="400" y="570">Validation</text>
    <text x="400" y="730">Pull Request</text>
    <text x="400" y="890">Human Review</text>
    <text x="400" y="1050">Merge</text>
    <text x="400" y="1210">GitHub Pages</text>
    <text x="400" y="1370">Feedback</text>
