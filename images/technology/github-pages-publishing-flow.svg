<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Pages publishing flow</title>
  <desc id="desc">Local website files move to a GitHub repository, are deployed by GitHub Pages, and become a live website.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f42c1"/>
    </marker>
  </defs>
  <rect width="800" height="720" rx="24" fill="#f7f4fc"/>
  <g fill="#ffffff" stroke="#6f42c1" stroke-width="4">
    <rect x="140" y="48" width="520" height="112" rx="18"/>
    <rect x="140" y="218" width="520" height="112" rx="18"/>
    <rect x="140" y="388" width="520" height="112" rx="18"/>
    <rect x="140" y="558" width="520" height="112" rx="18"/>
  </g>
  <g stroke="#6f42c1" stroke-width="5" marker-end="url(#arrow)">
    <path d="M400 168v34"/>
    <path d="M400 338v34"/>
    <path d="M400 508v34"/>
  </g>
  <g fill="#241833" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="400" y="115">Local Website Files</text>
    <text x="400" y="285">GitHub Repository</text>
    <text x="400" y="455">GitHub Pages</text>
    <text x="400" y="625">Live Website</text>
  </g>
</svg>
